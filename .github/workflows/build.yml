name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # リポジトリの Secrets に KEYSTORE_BASE64 / KS_PASS / KEY_ALIAS を登録すると、
      # 手元と同じ鍵で署名される（上書きインストール可能）。未登録なら使い捨ての鍵で署名。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > release.jks; fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'datameter' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'key' }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DataMeter-apk
          path: build/DataMeter.apk
